name: Release Readiness

on:
  workflow_dispatch:
  push:
    tags:
      - "v*.*.*"

jobs:
  release-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install deps
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
      - name: Validate question bank
        run: |
          python tools/validate_question_bank.py
      - name: Build static PWA assets
        run: |
          python tools/build_static_pwa_assets.py
      - name: Check OpenAPI contract
        run: |
          pytest tests/contracts
      - name: Gate tests
        run: |
          pytest tests/test_question_quality.py tests/test_content_factory.py tests/integration tests/backend tests/frontend tests/e2e --cov=gtest_quiz --cov=backend/app --cov-report=term-missing --cov-fail-under=70
      - name: Learning benchmark
        run: |
          python tools/benchmark_learning_policy.py --compare
      - name: Release readiness rubric
        run: |
          python tools/release_readiness.py
      - name: Build artifact snapshot
        run: |
          tar -czf gtest-quiz-${GITHUB_REF_NAME}.tgz app.py backend frontend gtest_quiz bank deploy requirements.txt config.toml README.md docs
