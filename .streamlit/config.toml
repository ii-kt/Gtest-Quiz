# ============================================================
#  G検定対策クイズアプリ 設定ファイル（現行コード対応版）
#  - アプリ基本情報
#  - Gemini API 設定
#  - ファイルパス
#  - 出題モード / クォータ
#  - UI デザイン（将来拡張用）
# ============================================================

# ------------------------------------------------------------
# アプリ基本情報 / 出題モード
# ------------------------------------------------------------
[app]
# アプリ名（ヘッダなどで使用）
name = "G検定問題集"

# 表示言語
language = "ja"

# 起動時のデフォルト出題モード
#   auto    : オンライン優先＋失敗時オフライン
#   online  : 常にオンライン優先
#   offline : オフラインのみ（安定動作用）
default_mode = "offline"  # まずはオフラインで確実に動かす


# ------------------------------------------------------------
# Gemini API
# ------------------------------------------------------------
[gemini]
# GCP プロジェクト ID（必要な場合のみ）
project_id = ""

# リージョン（空欄なら SDK のデフォルト）
location = ""

# 優先して使うモデル名
# 空文字列の場合は「利用可能なモデル一覧から自動選択」
preferred_model = ""


# ------------------------------------------------------------
# ファイルパス
# ------------------------------------------------------------
[paths]
meta           = "bank/meta.json"
question_bank  = "bank/question_bank.jsonl"
syllabus_pdf   = "data/JDLA_Gtest_Syllabus_2024_v1.3_JP.pdf"


# ------------------------------------------------------------
# クォータ関連
# ------------------------------------------------------------
[quota]
# 推定クォータに対する「限界に近い」判定の割合
# 例: 0.9 = 上限の 90% 付近でオンラインを控える
near_limit_ratio = 0.9


# ------------------------------------------------------------
# UI デザイン設定（現時点では主に将来拡張用）
# ------------------------------------------------------------
[ui]
app_title       = "G検定対策クイズアプリ"
app_description = "G検定シラバス準拠の四択クイズで、AI とオフライン問題を組み合わせて学習するアプリ。"

[ui.palette]
primary      = "#1947E5"
primary_soft = "#E4EBFF"
background   = "#0F172A"
surface      = "#111827"
text_main    = "#F9FAFB"
text_muted   = "#9CA3AF"
accent       = "#22C55E"
danger       = "#F97373"

[ui.font]
base = "system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif"
mono = "SFMono-Regular, Menlo, Monaco, Consolas, 'Courier New', monospace"

[ui.layout]
wide             = true
radius_small     = 6
radius_medium    = 12
radius_large     = 20
shadow_elevation = "medium"  # none | small | medium | strong


# ------------------------------------------------------------
# 推定クォータメーター（文言設定）
# ------------------------------------------------------------
[quota_meter]
show_in_sidebar = true
token_label = "本日のトークン使用量（入力＋出力）"
call_label  = "本日の API 呼び出し回数"
unknown_limit_hint = "十分なデータがないため、まだ正確な上限は推定できていない。利用を続けると精度が向上する。"
