<!doctype html>
<html lang="ja">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <meta name="theme-color" content="#f6f7fb" />
  <meta name="description" content="G検定向けの完全オフライン静的PWA" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-title" content="G検定 Quiz" />
  <meta name="apple-mobile-web-app-status-bar-style" content="default" />
  <link rel="manifest" href="./manifest.webmanifest" />
  <link rel="apple-touch-icon" href="./pwa-icon-180.png" />
  <title>G検定 Quiz Practice</title>
  <style>
    @layer reset, tokens, base, layout, components, states, responsive;

    @layer reset {
      *,
      *::before,
      *::after { box-sizing: border-box; }

      html {
        min-height: 100%;
        background: #f6f7fb;
        color: #15171f;
        text-size-adjust: 100%;
      }

      body {
        min-height: 100vh;
        margin: 0;
      }

      button,
      select {
        font: inherit;
      }

      button {
        appearance: none;
      }
    }

    @layer tokens {
      :root {
        color-scheme: light;
        --canvas: #f6f7fb;
        --surface: rgba(255, 255, 255, .86);
        --surface-strong: #ffffff;
        --ink: #15171f;
        --muted: #687084;
        --faint: #9299aa;
        --line: rgba(31, 35, 49, .12);
        --line-strong: rgba(31, 35, 49, .2);
        --teal: #008f8c;
        --green: #12815f;
        --coral: #e85b42;
        --amber: #b87900;
        --violet: #6857d9;
        --blue: #246bcb;
        --ink-soft: #2a2f3d;
        --shadow-soft: 0 22px 70px rgba(35, 39, 54, .12);
        --shadow-tight: 0 10px 30px rgba(35, 39, 54, .1);
        --radius-xl: 24px;
        --radius-lg: 18px;
        --radius-md: 12px;
        --radius-sm: 8px;
        --tap: 44px;
        --font: ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", "Hiragino Sans", "Yu Gothic UI", sans-serif;
      }
    }

    @layer base {
      body {
        color: var(--ink);
        font-family: var(--font);
        letter-spacing: 0;
        background:
          linear-gradient(180deg, rgba(255, 255, 255, .72), rgba(246, 247, 251, .92)),
          linear-gradient(90deg, rgba(0, 143, 140, .08) 0 1px, transparent 1px 100%),
          linear-gradient(180deg, rgba(104, 87, 217, .06) 0 1px, transparent 1px 100%),
          var(--canvas);
        background-size: auto, 46px 46px, 46px 46px, auto;
      }

      button,
      select {
        min-height: var(--tap);
        border: 1px solid var(--line);
        border-radius: var(--radius-sm);
        background: rgba(255, 255, 255, .86);
        color: var(--ink);
      }

      button {
        display: inline-flex;
        align-items: center;
        justify-content: center;
        gap: 8px;
        padding: 0 14px;
        font-weight: 760;
        cursor: pointer;
        transition:
          background .18s ease,
          border-color .18s ease,
          color .18s ease,
          box-shadow .18s ease,
          transform .18s ease;
      }

      button:not(:disabled):hover {
        border-color: var(--line-strong);
        background: #fff;
        box-shadow: 0 8px 22px rgba(35, 39, 54, .09);
        transform: translateY(-1px);
      }

      button:not(:disabled):active {
        transform: translateY(0);
      }

      button:disabled {
        cursor: not-allowed;
        opacity: .46;
      }

      button:focus-visible,
      select:focus-visible {
        outline: 3px solid rgba(0, 143, 140, .24);
        outline-offset: 3px;
      }

      select {
        width: 100%;
        padding: 0 12px;
        font-weight: 720;
      }
    }

    @layer layout {
      .app-shell {
        width: min(1440px, calc(100vw - 32px));
        min-height: 100vh;
        margin: 0 auto;
        padding:
          max(18px, env(safe-area-inset-top))
          0
          calc(28px + env(safe-area-inset-bottom));
      }

      .app-top {
        position: sticky;
        top: 0;
        z-index: 20;
        display: grid;
        grid-template-columns: minmax(0, 1fr) auto auto;
        gap: 16px;
        align-items: center;
        padding: 12px 0 18px;
        backdrop-filter: blur(18px);
      }

      .brand {
        display: flex;
        min-width: 0;
        align-items: center;
        gap: 12px;
      }

      .brand-mark {
        display: grid;
        flex: 0 0 auto;
        width: 42px;
        height: 42px;
        place-items: center;
        border: 1px solid rgba(0, 143, 140, .38);
        border-radius: 12px;
        background:
          linear-gradient(135deg, rgba(0, 143, 140, .16), rgba(232, 91, 66, .1)),
          #fff;
        color: #0d6867;
        font-size: 1rem;
        font-weight: 900;
        box-shadow: var(--shadow-tight);
      }

      h1 {
        margin: 0;
        font-size: clamp(1.2rem, 1.9vw, 1.75rem);
        line-height: 1.05;
        letter-spacing: 0;
      }

      .brand-sub {
        display: flex;
        flex-wrap: wrap;
        gap: 7px;
        margin-top: 8px;
      }

      .top-actions {
        display: flex;
        gap: 8px;
        justify-content: flex-end;
      }

      .workspace {
        container-type: inline-size;
        display: grid;
        grid-template-columns: minmax(0, 1fr) minmax(320px, 380px);
        gap: 18px;
        align-items: start;
      }

      .practice-panel,
      .insight-panel {
        border: 1px solid var(--line);
        border-radius: var(--radius-xl);
        background: var(--surface);
        box-shadow: var(--shadow-soft);
        overflow: clip;
      }

      .practice-panel {
        min-height: min(760px, calc(100vh - 116px));
        display: grid;
        grid-template-rows: auto auto minmax(0, 1fr) auto;
        backdrop-filter: blur(20px);
      }

      .panel-top,
      .feedback-panel,
      .section-head {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 12px;
      }

      .panel-top {
        min-height: 66px;
        padding: 0 22px;
        border-bottom: 1px solid var(--line);
        background: rgba(255, 255, 255, .7);
      }

      .question-stage {
        display: grid;
        align-content: start;
        gap: 22px;
        padding: clamp(20px, 3vw, 36px);
      }

      .question-copy {
        display: grid;
        gap: 12px;
      }

      .choice-grid {
        display: grid;
        gap: 12px;
      }

      .feedback-panel {
        align-items: end;
        padding: 18px 22px 22px;
        border-top: 1px solid var(--line);
        background: rgba(255, 255, 255, .74);
      }

      .feedback-copy {
        min-width: 0;
      }

      .feedback-actions {
        display: flex;
        flex: 0 0 auto;
        gap: 8px;
      }

      .side-stack {
        display: grid;
        gap: 18px;
      }

      .insight-panel {
        background: rgba(255, 255, 255, .78);
        container-type: inline-size;
      }

      .section-head {
        min-height: 56px;
        padding: 0 16px;
        border-bottom: 1px solid var(--line);
      }

      .metric-grid {
        display: grid;
        grid-template-columns: repeat(2, minmax(0, 1fr));
      }

      .metric {
        min-height: 92px;
        padding: 16px;
        border-right: 1px solid var(--line);
        border-bottom: 1px solid var(--line);
      }

      .metric:nth-child(2n) {
        border-right: 0;
      }

      .panel-body {
        display: grid;
        gap: 12px;
        padding: 16px;
      }
    }

    @layer components {
      .badge {
        display: inline-flex;
        align-items: center;
        gap: 7px;
        min-height: 28px;
        max-width: 100%;
        border: 1px solid var(--line);
        border-radius: 999px;
        padding: 0 10px;
        background: rgba(255, 255, 255, .74);
        color: var(--ink-soft);
        font-size: .78rem;
        font-weight: 800;
        white-space: nowrap;
      }

      .badge::before {
        content: "";
        width: 7px;
        height: 7px;
        border-radius: 50%;
        background: var(--faint);
        box-shadow: 0 0 0 4px rgba(146, 153, 170, .12);
      }

      .badge[data-tone="green"]::before { background: var(--green); box-shadow: 0 0 0 4px rgba(18, 129, 95, .12); }
      .badge[data-tone="amber"]::before { background: var(--amber); box-shadow: 0 0 0 4px rgba(184, 121, 0, .13); }
      .badge[data-tone="red"]::before { background: var(--coral); box-shadow: 0 0 0 4px rgba(232, 91, 66, .14); }
      .badge[data-tone="blue"]::before { background: var(--blue); box-shadow: 0 0 0 4px rgba(36, 107, 203, .13); }

      .primary {
        border-color: #15171f;
        background: #15171f;
        color: #fff;
      }

      .primary:not(:disabled):hover {
        border-color: #15171f;
        background: #242936;
        box-shadow: 0 12px 28px rgba(21, 23, 31, .22);
      }

      .ghost-danger {
        color: #9b301f;
      }

      .chapter-line {
        min-width: 0;
        overflow: hidden;
        color: var(--muted);
        font-size: .9rem;
        font-weight: 720;
        text-overflow: ellipsis;
        white-space: nowrap;
      }

      .meta-cluster {
        display: flex;
        flex-wrap: wrap;
        gap: 8px;
        justify-content: flex-end;
      }

      .loading {
        height: 3px;
        overflow: hidden;
        background: rgba(31, 35, 49, .08);
      }

      .loading span {
        display: block;
        width: 36%;
        height: 100%;
        background: linear-gradient(90deg, var(--teal), var(--coral), var(--violet));
        animation: loading-slide 1.05s cubic-bezier(.6, 0, .2, 1) infinite;
      }

      .loading[hidden] {
        display: none;
      }

      .eyebrow {
        margin: 0;
        color: var(--teal);
        font-size: .78rem;
        font-weight: 900;
        letter-spacing: .08em;
        text-transform: uppercase;
      }

      #question {
        max-width: 58rem;
        margin: 0;
        font-size: clamp(1.42rem, 2.5vw, 2.35rem);
        font-weight: 850;
        line-height: 1.52;
        letter-spacing: 0;
        overflow-wrap: anywhere;
        text-wrap: pretty;
      }

      .choice {
        width: 100%;
        min-height: 68px;
        display: grid;
        grid-template-columns: 38px minmax(0, 1fr);
        gap: 14px;
        align-items: center;
        padding: 14px;
        border-color: rgba(31, 35, 49, .14);
        border-radius: var(--radius-md);
        background: rgba(255, 255, 255, .82);
        text-align: left;
      }

      .choice:hover {
        border-color: rgba(0, 143, 140, .34);
      }

      .key {
        display: grid;
        width: 38px;
        height: 38px;
        place-items: center;
        border: 1px solid rgba(31, 35, 49, .1);
        border-radius: 11px;
        background: #f1f4f8;
        color: #303646;
        font-weight: 900;
      }

      .choice-text {
        min-width: 0;
        color: var(--ink-soft);
        font-size: 1rem;
        font-weight: 680;
        line-height: 1.55;
        overflow-wrap: anywhere;
      }

      #result {
        max-width: 58rem;
        min-height: 4.8em;
        margin: 0;
        color: #3d4352;
        font-size: .98rem;
        line-height: 1.72;
        white-space: pre-wrap;
        text-wrap: pretty;
      }

      .source-panel {
        display: grid;
        gap: 6px;
        max-width: 58rem;
        margin-top: 14px;
        padding-top: 12px;
        border-top: 1px solid var(--line);
        color: var(--muted);
        font-size: .84rem;
        line-height: 1.6;
      }

      .source-panel a {
        color: var(--ink);
        text-decoration-thickness: 1px;
        text-underline-offset: 3px;
      }

      .metric-label,
      .row-label {
        color: var(--muted);
        font-size: .78rem;
        font-weight: 800;
      }

      .metric-value {
        display: block;
        margin-top: 8px;
        color: var(--ink);
        font-size: clamp(1.38rem, 4vw, 2rem);
        font-weight: 900;
        line-height: 1;
      }

      .row {
        display: grid;
        gap: 8px;
      }

      .status-grid {
        display: grid;
        grid-template-columns: repeat(2, minmax(0, 1fr));
        gap: 10px;
      }

      .status-chip {
        min-width: 0;
        padding: 10px;
        border: 1px solid var(--line);
        border-radius: var(--radius-sm);
        background: rgba(255, 255, 255, .68);
      }

      .status-chip span {
        display: block;
        color: var(--muted);
        font-size: .72rem;
        font-weight: 800;
      }

      .status-chip strong {
        display: block;
        margin-top: 4px;
        color: var(--ink);
        font-size: .92rem;
        overflow-wrap: anywhere;
      }

      .row-label {
        display: flex;
        justify-content: space-between;
        gap: 12px;
      }

      .row-label span:first-child {
        min-width: 0;
        overflow: hidden;
        text-overflow: ellipsis;
        white-space: nowrap;
      }

      .bar {
        height: 10px;
        overflow: hidden;
        border-radius: 999px;
        background: rgba(31, 35, 49, .09);
      }

      .bar > span {
        display: block;
        width: 0%;
        height: 100%;
        border-radius: inherit;
        background: linear-gradient(90deg, var(--coral), var(--amber), var(--green));
      }

      .timeline {
        display: grid;
        grid-template-columns: 9px minmax(0, 1fr) auto;
        gap: 10px;
        align-items: center;
        color: var(--ink-soft);
        font-size: .9rem;
      }

      .timeline span:nth-child(2) {
        min-width: 0;
        overflow: hidden;
        text-overflow: ellipsis;
        white-space: nowrap;
      }

      .dot {
        width: 9px;
        height: 9px;
        border-radius: 50%;
        background: var(--blue);
      }

      .dot.correct { background: var(--green); }
      .dot.wrong { background: var(--coral); }

      .empty,
      .status {
        color: var(--muted);
        font-size: .9rem;
        line-height: 1.6;
      }

      #importFile {
        display: none;
      }
    }

    @layer states {
      .choice[aria-pressed="true"] {
        border-color: rgba(36, 107, 203, .42);
        background: rgba(36, 107, 203, .08);
      }

      .choice.is-correct {
        border-color: rgba(18, 129, 95, .45);
        background: rgba(18, 129, 95, .1);
      }

      .choice.is-correct .key {
        border-color: rgba(18, 129, 95, .32);
        background: rgba(18, 129, 95, .14);
        color: #0b684b;
      }

      .choice.is-wrong {
        border-color: rgba(232, 91, 66, .44);
        background: rgba(232, 91, 66, .1);
      }

      .choice.is-wrong .key {
        border-color: rgba(232, 91, 66, .34);
        background: rgba(232, 91, 66, .13);
        color: #9b301f;
      }

      @keyframes loading-slide {
        from { transform: translateX(-120%); }
        to { transform: translateX(320%); }
      }

      @media (prefers-reduced-motion: no-preference) {
        .practice-panel,
        .insight-panel {
          animation: surface-in .42s ease both;
        }

        .choice {
          animation: choice-in .24s ease both;
        }

        .choice:nth-child(2) { animation-delay: .035s; }
        .choice:nth-child(3) { animation-delay: .07s; }
        .choice:nth-child(4) { animation-delay: .105s; }
      }

      @keyframes surface-in {
        from { opacity: 0; transform: translateY(10px); }
        to { opacity: 1; transform: translateY(0); }
      }

      @keyframes choice-in {
        from { opacity: 0; transform: translateY(6px); }
        to { opacity: 1; transform: translateY(0); }
      }
    }

    @layer responsive {
      @container (max-width: 300px) {
        .metric-grid {
          grid-template-columns: 1fr;
        }

        .metric {
          border-right: 0;
        }
      }

      @media (max-width: 920px) {
        .app-top {
          grid-template-columns: 1fr;
        }

        .top-actions,
        .brand-sub {
          justify-content: flex-start;
        }
      }

      @media (max-width: 980px) {
        .workspace {
          grid-template-columns: 1fr;
        }

        .practice-panel {
          min-height: 0;
        }

        .side-stack {
          grid-template-columns: repeat(2, minmax(0, 1fr));
        }
      }

      @media (max-width: 640px) {
        .app-shell {
          width: min(100vw - 18px, 1440px);
          padding-top: max(10px, env(safe-area-inset-top));
        }

        .app-top {
          position: static;
          gap: 12px;
          padding-bottom: 12px;
        }

        .brand-mark {
          width: 38px;
          height: 38px;
          border-radius: 10px;
        }

        .top-actions,
        .feedback-actions {
          display: grid;
          grid-template-columns: repeat(3, minmax(0, 1fr));
        }

        .feedback-actions {
          grid-template-columns: 1fr 1fr;
        }

        .practice-panel,
        .insight-panel {
          border-radius: 18px;
        }

        .panel-top,
        .feedback-panel {
          display: grid;
          align-items: stretch;
          padding-inline: 14px;
        }

        .meta-cluster {
          justify-content: flex-start;
        }

        .question-stage {
          padding: 18px 14px 22px;
          gap: 18px;
        }

        #question {
          font-size: 1.36rem;
        }

        .choice {
          min-height: 64px;
          grid-template-columns: 34px minmax(0, 1fr);
          gap: 12px;
          padding: 12px;
        }

        .key {
          width: 34px;
          height: 34px;
          border-radius: 9px;
        }

        .feedback-panel {
          gap: 16px;
        }

        .side-stack {
          grid-template-columns: 1fr;
        }

        .metric-grid {
          grid-template-columns: repeat(2, minmax(0, 1fr));
        }
      }

      @media (max-width: 390px) {
        .metric-grid,
        .feedback-actions {
          grid-template-columns: 1fr;
        }

        .metric {
          border-right: 0;
        }
      }
    }
  </style>
</head>
<body>
  <main class="app-shell">
    <header class="app-top">
      <div class="brand">
        <div class="brand-mark" aria-hidden="true">GQ</div>
        <div>
          <h1>G検定 Quiz Practice</h1>
          <div class="brand-sub" aria-label="app status">
            <span id="apiState" class="badge" data-tone="green">完全オフライン</span>
            <span id="sessionState" class="badge" data-tone="blue" hidden>端末保存</span>
            <span id="queueState" class="badge" data-tone="amber">問題 0</span>
          </div>
        </div>
      </div>
      <div class="top-actions">
        <button id="startBtn" class="primary" type="button">学習開始</button>
        <button id="refreshBtn" type="button">保存</button>
        <button id="logoutBtn" class="ghost-danger" type="button">リセット</button>
      </div>
    </header>

    <section class="workspace" aria-label="practice workspace">
      <article class="practice-panel">
        <div class="panel-top">
          <div id="chapter" class="chapter-line">standby</div>
          <div class="meta-cluster">
            <span id="difficulty" class="badge">-</span>
            <span id="reason" class="badge" data-tone="amber">standby</span>
            <span id="score" class="badge" data-tone="green">0 / 0</span>
          </div>
        </div>

        <div id="loadingBar" class="loading" hidden><span></span></div>

        <div class="question-stage">
          <div class="question-copy">
            <p class="eyebrow">Question</p>
            <h2 id="question">問題データを読み込み中です。</h2>
            <div id="sourcePanel" class="source-panel" hidden></div>
          </div>
          <div id="choices" class="choice-grid"></div>
        </div>

        <div class="feedback-panel">
          <div class="feedback-copy">
            <p id="result" aria-live="polite">準備中</p>
          </div>
          <div class="feedback-actions">
            <button id="syncBtn" type="button">保存</button>
            <button id="nextBtn" class="primary" type="button" disabled>次の問題</button>
          </div>
        </div>
      </article>

      <aside class="side-stack">
        <section class="insight-panel">
          <div class="section-head">
            <strong>Performance</strong>
            <span id="total" class="badge">回答 0</span>
          </div>
          <div class="metric-grid">
            <div class="metric"><span class="metric-label">正答率</span><span id="accuracy" class="metric-value">0%</span></div>
            <div class="metric"><span class="metric-label">連続正解</span><span id="streak" class="metric-value">0</span></div>
            <div class="metric"><span class="metric-label">正解</span><span id="correctTotal" class="metric-value">0</span></div>
            <div class="metric"><span class="metric-label">回答</span><span id="answerTotal" class="metric-value">0</span></div>
            <div class="metric"><span class="metric-label">復習待ち</span><span id="dueNow" class="metric-value">0</span></div>
            <div class="metric"><span class="metric-label">追跡項目</span><span id="trackedItems" class="metric-value">0</span></div>
          </div>
        </section>

        <section class="insight-panel">
          <div class="section-head">
            <strong>Learning Mode</strong>
            <span id="requestState" class="badge">local</span>
          </div>
          <div class="panel-body">
            <select id="policySelect" aria-label="learning policy">
              <option value="adaptive_mastery_v2">adaptive_mastery_v2</option>
              <option value="chapter_balanced_v1">chapter_balanced_v1</option>
              <option value="random_baseline_v1">random_baseline_v1</option>
            </select>
            <button id="exportBtn" type="button">エクスポート</button>
            <button id="importBtn" type="button">インポート</button>
            <input id="importFile" type="file" accept="application/json" />
            <div id="authState" class="status" aria-live="polite">ローカルプロファイル</div>
          </div>
        </section>

        <section class="insight-panel">
          <div class="section-head"><strong>Bank Status</strong></div>
          <div id="bankStatus" class="panel-body"><div class="empty">データ待機中</div></div>
        </section>

        <section class="insight-panel">
          <div class="section-head"><strong>Weak Map</strong></div>
